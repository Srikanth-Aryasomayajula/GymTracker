<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#1C1B19">
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --surface:#252320;
    --surface-2:#302D28;
    --border:#3A362F;
    --text:#F3F0E8;
    --text-dim:#9C968A;
    --accent:#F5C518;
    --accent-ink:#1C1B19;
    --danger:#D6604A;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
    min-height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:baseline;justify-content:space-between;
    padding:18px 18px 14px;
    background:linear-gradient(var(--bg) 80%, transparent);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.06em;
    margin:0;
    text-transform:uppercase;
  }
  .topbar .stat{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  main{padding:0 14px;max-width:520px;margin:0 auto;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px 12px;
    color:var(--text);
    font-size:16px;
    font-family:inherit;
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus, select:focus{outline:2px solid var(--accent);outline-offset:0;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;}
  .weight-wrap{display:flex;gap:6px;}
  .weight-wrap input{flex:1;min-width:0;}
  .weight-wrap select{width:68px;flex-shrink:0;padding-left:8px;text-align:center;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .chip{
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13px;
    padding:6px 12px;
    border-radius:100px;
    white-space:nowrap;
  }
  .chip:active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:8px;
    padding:14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .btn-primary:active{opacity:0.85;}
  .search-bar{margin-bottom:14px;}
  .day-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:20px 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .entry{
    display:flex;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  .entry:last-child{border-bottom:none;}
  .plates{display:flex;flex-direction:column-reverse;gap:2px;padding-top:2px;width:8px;flex-shrink:0;}
  .plate{width:8px;height:5px;background:var(--accent);border-radius:1px;}
  .plate.more{background:transparent;color:var(--text-dim);font-size:9px;width:auto;height:auto;font-family:'IBM Plex Mono',monospace;}
  .entry-body{flex:1;min-width:0;}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .entry-machine{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .entry-nums{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--accent);
    margin-top:2px;
  }
  .entry-settings, .entry-notes{
    font-size:13px;
    color:var(--text-dim);
    margin-top:3px;
  }
  .delete-btn{
    background:none;border:none;color:var(--text-dim);
    font-size:20px;line-height:1;padding:4px 6px;flex-shrink:0;
  }
  .delete-btn:active{color:var(--danger);}
  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:40px 20px;
    font-size:14px;
  }
  .snackbar{
    position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;
    transform:translateY(120%);transition:transform 0.25s ease;
    max-width:520px;margin:0 auto;z-index:20;
  }
  .snackbar.show{transform:translateY(0);}
  .snackbar button{background:none;border:none;color:var(--accent);font-weight:600;font-family:inherit;font-size:13px;}
  .footer-actions{display:flex;justify-content:center;gap:24px;margin-top:28px;padding-top:16px;border-top:1px solid var(--border);}
  .link-btn{background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:6px;font-family:inherit;}
</style>
</head>
<body>

<div class="topbar">
  <h1>Gym Log</h1>
  <div class="stat" id="stat"></div>
</div>

<main>
  <div class="card add-card">
    <div class="field">
      <label for="machine">Machine</label>
      <input type="text" id="machine" placeholder="e.g. Leg Press" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>

    <div class="row3">
      <div class="field">
        <label for="sets">Sets</label>
        <input type="number" id="sets" inputmode="numeric" min="0" placeholder="3">
      </div>
      <div class="field">
        <label for="reps">Reps</label>
        <input type="number" id="reps" inputmode="numeric" min="0" placeholder="10">
      </div>
      <div class="field">
        <label for="weight">Weight</label>
        <div class="weight-wrap">
          <input type="number" id="weight" inputmode="decimal" min="0" placeholder="0">
          <select id="unit">
            <option value="kg">kg</option>
            <option value="lb">lb</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="settings">Machine settings</label>
      <input type="text" id="settings" placeholder="e.g. seat 4, incline 2, pin 6">
    </div>

    <div class="field">
      <label for="notes">Notes (optional)</label>
      <input type="text" id="notes" placeholder="e.g. felt easy, increase next time">
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date">
    </div>

    <button type="button" class="btn-primary" id="save-btn">Log set</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Filter by machine" aria-label="Filter by machine">
  </div>

  <div id="list"></div>

  <div class="footer-actions">
    <button type="button" class="link-btn" id="export-btn">Export backup</button>
    <button type="button" class="link-btn" id="import-btn">Import backup</button>
    <input type="file" id="import-file" accept="application/json" style="display:none">
  </div>
</main>

<div class="snackbar" id="snackbar">
  <span id="snackbar-text"></span>
  <button type="button" id="undo-btn">Undo</button>
</div>

<script>
const STORAGE_KEY = 'gymlog-data-v1';
let data = { entries: [], unit: 'kg' };
let pendingDelete = null;
let undoTimer = null;

const $ = (id) => document.getElementById(id);

function escapeHtml(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data.entries = Array.isArray(parsed.entries) ? parsed.entries : [];
      data.unit = parsed.unit || 'kg';
    }
  }catch(e){
    console.error('Could not load saved data', e);
  }
  $('unit').value = data.unit;
  $('date').value = todayStr();
  render();
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.error('Save failed', e);
    alert('Could not save. Your browser storage may be full, or private browsing may be blocking it.');
  }
}

function formatDayLabel(dateStr){
  const today = todayStr();
  const y = new Date(today + 'T00:00:00');
  y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(dateStr === today) return 'Today';
  if(dateStr === yesterday) return 'Yesterday';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}

function uniqueMachines(){
  const seen = [];
  const set = new Set();
  for(const e of data.entries){
    if(!set.has(e.machine)){ set.add(e.machine); seen.push(e.machine); }
  }
  return seen.slice(0,8);
}

function renderChips(){
  const chips = uniqueMachines();
  const el = $('chips');
  if(chips.length === 0){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='flex';
  el.innerHTML = chips.map(m =>
    `<button type="button" class="chip" data-m="${escapeHtml(m)}">${escapeHtml(m)}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{ $('machine').value = c.dataset.m; $('machine').focus(); });
  });
}

function render(){
  renderChips();
  const totalSets = data.entries.reduce((sum,e)=> sum + (Number(e.sets)||0), 0);
  $('stat').textContent = data.entries.length ? `${data.entries.length} logged · ${totalSets} sets` : '';

  const term = $('search').value.trim().toLowerCase();
  const filtered = term
    ? data.entries.filter(e => e.machine.toLowerCase().includes(term))
    : data.entries;

  if(filtered.length === 0){
    $('list').innerHTML = `<div class="empty-state">${data.entries.length===0 ? 'No sets logged yet. Add your first one above.' : 'No entries match that filter.'}</div>`;
    return;
  }

  const sorted = [...filtered].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
  const groups = [];
  let currentDate = null, currentGroup = null;
  for(const e of sorted){
    if(e.date !== currentDate){
      currentDate = e.date;
      currentGroup = { date: e.date, items: [] };
      groups.push(currentGroup);
    }
    currentGroup.items.push(e);
  }

  $('list').innerHTML = groups.map(g => `
    <div class="day-label">${formatDayLabel(g.date)}</div>
    ${g.items.map(entryHtml).join('')}
  `).join('');

  $('list').querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(btn.dataset.id));
  });
}

function entryHtml(e){
  const setsNum = Number(e.sets)||0;
  const setsCount = Math.max(0, Math.min(8, setsNum));
  const platesHtml = Array.from({length:setsCount}).map(()=>'<div class="plate"></div>').join('');
  const extra = setsNum > 8 ? `<div class="plate more">+${setsNum-8}</div>` : '';
  const weightStr = (e.weight !== null && e.weight !== '') ? `${e.weight}${e.unit||'kg'}` : '';
  const numsParts = [];
  if(e.sets || e.reps) numsParts.push(`${e.sets||0}×${e.reps||0}`);
  if(weightStr) numsParts.push(weightStr);

  return `
    <div class="entry">
      <div class="plates">${platesHtml}${extra}</div>
      <div class="entry-body">
        <div class="entry-top">
          <div>
            <div class="entry-machine">${escapeHtml(e.machine)}</div>
            ${numsParts.length ? `<div class="entry-nums">${numsParts.join(' · ')}</div>` : ''}
          </div>
          <button type="button" class="delete-btn" data-id="${e.id}" aria-label="Delete entry">×</button>
        </div>
        ${e.settings ? `<div class="entry-settings">${escapeHtml(e.settings)}</div>` : ''}
        ${e.notes ? `<div class="entry-notes">${escapeHtml(e.notes)}</div>` : ''}
      </div>
    </div>
  `;
}

function saveNewEntry(){
  const machine = $('machine').value.trim();
  if(!machine){ $('machine').focus(); return; }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    machine,
    sets: $('sets').value ? Number($('sets').value) : null,
    reps: $('reps').value ? Number($('reps').value) : null,
    weight: $('weight').value ? Number($('weight').value) : null,
    unit: $('unit').value,
    settings: $('settings').value.trim(),
    notes: $('notes').value.trim(),
    date: $('date').value || todayStr(),
  };

  data.entries.push(entry);
  data.unit = entry.unit;
  persist();

  $('machine').value = '';
  $('sets').value = '';
  $('reps').value = '';
  $('weight').value = '';
  $('settings').value = '';
  $('notes').value = '';
  $('date').value = todayStr();
  $('machine').focus();

  render();
}

function deleteEntry(id){
  const idx = data.entries.findIndex(e=>e.id===id);
  if(idx === -1) return;
  pendingDelete = { entry: data.entries[idx], idx };
  data.entries.splice(idx,1);
  render();
  persist();
  showSnackbar(`Deleted ${pendingDelete.entry.machine}`);
}

function showSnackbar(text){
  $('snackbar-text').textContent = text;
  $('snackbar').classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>{
    $('snackbar').classList.remove('show');
    pendingDelete = null;
  }, 5000);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gym-log-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      const importedEntries = Array.isArray(imported.entries) ? imported.entries : [];
      const existingIds = new Set(data.entries.map(x=>x.id));
      data.entries = data.entries.concat(importedEntries.filter(x=>!existingIds.has(x.id)));
      persist();
      render();
      alert(`Imported ${importedEntries.length} entries.`);
    }catch(err){
      alert('Could not read that backup file.');
    }
  };
  reader.readAsText(file);
}

$('undo-btn').addEventListener('click', ()=>{
  if(pendingDelete){
    data.entries.splice(pendingDelete.idx, 0, pendingDelete.entry);
    persist();
    render();
    pendingDelete = null;
  }
  $('snackbar').classList.remove('show');
  clearTimeout(undoTimer);
});

$('save-btn').addEventListener('click', saveNewEntry);
$('search').addEventListener('input', render);
$('unit').addEventListener('change', ()=>{ data.unit = $('unit').value; });
$('machine').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); saveNewEntry(); } });
$('export-btn').addEventListener('click', exportBackup);
$('import-btn').addEventListener('click', ()=> $('import-file').click());
$('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) handleImportFile(file);
  e.target.value = '';
});

load();
</script>
</body>
</html>
